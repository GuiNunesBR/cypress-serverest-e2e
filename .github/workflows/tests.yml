name: Testes

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 11 * * 1-5'   # dias úteis, 08:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      relatorio: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx cypress install
      - run: npm run typecheck
      - run: npm run lint
      # Os testes de unidade não usam rede: se falharem, o ServeRest compartilhado nem chega a ser chamado.
      - run: npm run test:unit
      - run: npm test
      - name: Guarda o relatório HTML
        if: ${{ !cancelled() && hashFiles('cypress/reports/html/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: cypress-report
          path: cypress/reports/html/
          retention-days: 14
      - name: Prepara a publicação do relatório
        id: pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('cypress/reports/html/index.html') != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: cypress/reports/html/

  publicar-relatorio:
    if: ${{ !cancelled() && needs.testes.outputs.relatorio == 'success' }}
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
